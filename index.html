    <title>VORTEXMC.GG - Serwer Minecraft</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

        body {
            background-color: #0d0814;
            background-image:

                radial-gradient(circle at 85% 30%, rgba(126, 34, 206, 0.2) 0%, transparent 45%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;

        }

        .logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo-text span {
            color: #a855f7;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
        }

            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
